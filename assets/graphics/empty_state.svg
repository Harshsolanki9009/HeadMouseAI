<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200">
  <defs>
    <radialGradient id="emptyGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#34383D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#17191C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="280" height="200" fill="#17191C"/>

  <!-- Halo backdrop -->
  <circle cx="140" cy="80" r="60" fill="url(#emptyGlow)"/>

  <!-- Concentric idle ripples -->
  <circle cx="140" cy="80" r="45" fill="none" stroke="#222529" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="140" cy="80" r="32" fill="none" stroke="#34383D" stroke-width="1.2"/>

  <!-- Subtle clipboard / document outline -->
  <rect x="120" y="55" width="40" height="50" rx="4" fill="#222529" stroke="#777F87" stroke-width="1.5"/>
  <!-- Clipboard clip -->
  <rect x="132" y="50" width="16" height="7" rx="2" fill="#34383D" stroke="#777F87" stroke-width="1"/>
  <!-- Document placeholder lines -->
  <line x1="128" y1="68" x2="152" y2="68" stroke="#777F87" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="128" y1="76" x2="148" y2="76" stroke="#34383D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="128" y1="84" x2="144" y2="84" stroke="#34383D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="128" y1="92" x2="150" y2="92" stroke="#34383D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Floating sparkle / ready indicator -->
  <circle cx="166" cy="56" r="3" fill="#89958C"/>

  <!-- Copy -->
  <text x="140" y="145" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#B9C0C7" text-anchor="middle">No Active Tasks</text>
  <text x="140" y="165" font-family="'Segoe UI', sans-serif" font-size="11" fill="#777F87" text-anchor="middle">Speak a command or request desktop assistance</text>
</svg>
