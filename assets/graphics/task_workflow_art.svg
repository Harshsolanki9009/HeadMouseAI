<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <defs>
    <linearGradient id="nodeBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F0EA"/>
      <stop offset="100%" stop-color="#777F87"/>
    </linearGradient>
    <linearGradient id="connectLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#777F87"/>
      <stop offset="50%" stop-color="#F2F0EA"/>
      <stop offset="100%" stop-color="#89958C"/>
    </linearGradient>
  </defs>

  <rect width="600" height="240" rx="10" fill="#17191C"/>

  <!-- Connecting flow lines -->
  <path d="M 120,120 L 170,120" stroke="url(#connectLine)" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M 270,120 L 320,120" stroke="url(#connectLine)" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M 420,120 L 470,120" stroke="url(#connectLine)" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Node 1: Intent -->
  <g transform="translate(30, 80)">
    <rect width="90" height="80" rx="8" fill="#222529" stroke="#34383D" stroke-width="1.5"/>
    <circle cx="45" cy="30" r="14" fill="#34383D"/>
    <!-- Voice wave icon inside -->
    <path d="M 39,30 L 39,30 M 42,26 L 42,34 M 45,22 L 45,38 M 48,25 L 48,35 M 51,29 L 51,31" stroke="#F2F0EA" stroke-width="2" stroke-linecap="round"/>
    <text x="45" y="60" font-family="'Segoe UI', sans-serif" font-size="10" fill="#F2F0EA" text-anchor="middle" font-weight="600">INTENT</text>
    <text x="45" y="71" font-family="'Segoe UI', sans-serif" font-size="8" fill="#777F87" text-anchor="middle">Voice / Chat</text>
  </g>

  <!-- Node 2: Observe (UIA) -->
  <g transform="translate(180, 80)">
    <rect width="90" height="80" rx="8" fill="#222529" stroke="#34383D" stroke-width="1.5"/>
    <circle cx="45" cy="30" r="14" fill="#34383D"/>
    <!-- Window layout / scan icon -->
    <rect x="37" y="23" width="16" height="13" rx="1.5" fill="none" stroke="#F2F0EA" stroke-width="1.5"/>
    <line x1="37" y1="27" x2="53" y2="27" stroke="#F2F0EA" stroke-width="1"/>
    <text x="45" y="60" font-family="'Segoe UI', sans-serif" font-size="10" fill="#F2F0EA" text-anchor="middle" font-weight="600">OBSERVE</text>
    <text x="45" y="71" font-family="'Segoe UI', sans-serif" font-size="8" fill="#777F87" text-anchor="middle">UIA Tree Scan</text>
  </g>

  <!-- Node 3: Plan (Gemini) -->
  <g transform="translate(330, 80)">
    <rect width="90" height="80" rx="8" fill="#222529" stroke="url(#nodeBorderGrad)" stroke-width="1.8"/>
    <circle cx="45" cy="30" r="14" fill="#34383D"/>
    <!-- Brain / Logic node icon -->
    <circle cx="41" cy="27" r="3" fill="#F2F0EA"/>
    <circle cx="49" cy="27" r="3" fill="#F2F0EA"/>
    <circle cx="45" cy="35" r="3" fill="#F2F0EA"/>
    <line x1="41" y1="27" x2="49" y2="27" stroke="#F2F0EA" stroke-width="1"/>
    <line x1="41" y1="27" x2="45" y2="35" stroke="#F2F0EA" stroke-width="1"/>
    <line x1="49" y1="27" x2="45" y2="35" stroke="#F2F0EA" stroke-width="1"/>
    <text x="45" y="60" font-family="'Segoe UI', sans-serif" font-size="10" fill="#F2F0EA" text-anchor="middle" font-weight="600">PLAN</text>
    <text x="45" y="71" font-family="'Segoe UI', sans-serif" font-size="8" fill="#B9C0C7" text-anchor="middle">Gemini Flash</text>
  </g>

  <!-- Node 4: Execute & Verify (agent-desktop) -->
  <g transform="translate(480, 80)">
    <rect width="90" height="80" rx="8" fill="#222529" stroke="#89958C" stroke-width="1.5"/>
    <circle cx="45" cy="30" r="14" fill="#34383D"/>
    <!-- Checkmark & Click icon -->
    <path d="M 39,30 L 43,34 L 51,25" fill="none" stroke="#89958C" stroke-width="2" stroke-linecap="round"/>
    <text x="45" y="60" font-family="'Segoe UI', sans-serif" font-size="10" fill="#F2F0EA" text-anchor="middle" font-weight="600">ACT &amp; VERIFY</text>
    <text x="45" y="71" font-family="'Segoe UI', sans-serif" font-size="8" fill="#89958C" text-anchor="middle">agent-desktop</text>
  </g>

  <!-- Flow Status Pill -->
  <rect x="235" y="195" width="130" height="24" rx="12" fill="#222529" stroke="#34383D" stroke-width="1"/>
  <circle cx="249" cy="207" r="4" fill="#89958C"/>
  <text x="298" y="211" font-family="'Segoe UI', sans-serif" font-size="9" fill="#B9C0C7" text-anchor="middle" font-weight="500">CLOSED LOOP AGENT</text>
</svg>
