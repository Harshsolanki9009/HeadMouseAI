<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="targetHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2F0EA" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#89958C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#17191C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vectorBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F0EA"/>
      <stop offset="100%" stop-color="#B9C0C7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="320" height="320" rx="12" fill="#17191C"/>

  <!-- Bounding reticle / tracking frame -->
  <path d="M 30,50 L 30,30 L 50,30" fill="none" stroke="#777F87" stroke-width="2"/>
  <path d="M 270,30 L 290,30 L 290,50" fill="none" stroke="#777F87" stroke-width="2"/>
  <path d="M 290,270 L 290,290 L 270,290" fill="none" stroke="#777F87" stroke-width="2"/>
  <path d="M 50,290 L 30,290 L 30,270" fill="none" stroke="#777F87" stroke-width="2"/>

  <!-- Subtle face landmark mesh (wireframe) -->
  <!-- Jawline contour -->
  <path d="M 80,110 C 80,210 120,260 160,265 C 200,260 240,210 240,110" fill="none" stroke="#34383D" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Forehead arc -->
  <path d="M 80,110 C 100,65 220,65 240,110" fill="none" stroke="#34383D" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Left eye & eyebrow -->
  <path d="M 105,115 Q 120,105 135,115 Q 120,125 105,115 Z" fill="#222529" stroke="#777F87" stroke-width="1.5"/>
  <circle cx="120" cy="115" r="3.5" fill="#B9C0C7"/>
  <path d="M 100,102 Q 120,95 138,104" fill="none" stroke="#777F87" stroke-width="2"/>

  <!-- Right eye & eyebrow -->
  <path d="M 185,115 Q 200,105 215,115 Q 200,125 185,115 Z" fill="#222529" stroke="#777F87" stroke-width="1.5"/>
  <circle cx="200" cy="115" r="3.5" fill="#B9C0C7"/>
  <path d="M 182,104 Q 200,95 220,102" fill="none" stroke="#777F87" stroke-width="2"/>

  <!-- Nose bridge -->
  <line x1="160" y1="110" x2="160" y2="165" stroke="#777F87" stroke-width="1.5"/>
  <path d="M 150,165 Q 160,172 170,165" fill="none" stroke="#777F87" stroke-width="1.5"/>

  <!-- Mouth -->
  <path d="M 135,210 Q 160,225 185,210" fill="none" stroke="#34383D" stroke-width="1.5"/>
  <path d="M 140,210 Q 160,215 180,210" fill="none" stroke="#34383D" stroke-width="1.5"/>

  <!-- Target: Nose Tip Landmark (Index 4) with Precision Crosshair -->
  <circle cx="160" cy="165" r="30" fill="url(#targetHalo)"/>
  <circle cx="160" cy="165" r="14" fill="none" stroke="#F2F0EA" stroke-width="2"/>
  <circle cx="160" cy="165" r="4.5" fill="#F2F0EA"/>
  <line x1="160" y1="145" x2="160" y2="185" stroke="#F2F0EA" stroke-width="1.5"/>
  <line x1="140" y1="165" x2="180" y2="165" stroke="#F2F0EA" stroke-width="1.5"/>

  <!-- Virtual Cursor Raycast Vector -->
  <line x1="160" y1="165" x2="245" y2="85" stroke="url(#vectorBeam)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cursor Arrow at destination -->
  <polygon points="245,85 242,100 249,94 258,97 261,91 252,88 260,82" fill="#F2F0EA" stroke="#17191C" stroke-width="1"/>

  <!-- Precision Badge / Coordinates Text -->
  <text x="160" y="295" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" fill="#777F87" text-anchor="middle" letter-spacing="1.5">NOSE TRACKING • 60 FPS • AVX2</text>
</svg>
