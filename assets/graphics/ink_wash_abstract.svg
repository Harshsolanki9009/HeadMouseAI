<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <radialGradient id="inkSumi1" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#34383D" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#222529" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#17191C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inkSumi2" cx="75%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#777F87" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#222529" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#17191C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mistLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34383D" stop-opacity="0"/>
      <stop offset="30%" stop-color="#B9C0C7" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#89958C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#17191C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="#17191C"/>

  <!-- Organic ink dispersion clouds -->
  <path d="M-50,200 Q 150,120 320,180 T 680,140 Q 820,160 850,220 L 850,450 L -50,450 Z" fill="url(#inkSumi1)"/>
  <circle cx="240" cy="180" r="160" fill="url(#inkSumi1)" filter="blur(20px)"/>
  <circle cx="620" cy="240" r="190" fill="url(#inkSumi2)" filter="blur(30px)"/>

  <!-- Subtle flowing ink strata curves -->
  <path d="M 0,260 C 180,210 320,310 500,240 S 720,190 800,220" fill="none" stroke="url(#mistLine)" stroke-width="2"/>
  <path d="M 0,290 C 220,240 380,340 560,280 S 740,230 800,250" fill="none" stroke="url(#mistLine)" stroke-width="1.2" stroke-dasharray="6,4"/>
  <path d="M 0,230 C 140,190 280,270 460,210 S 680,160 800,190" fill="none" stroke="url(#mistLine)" stroke-width="0.8" opacity="0.6"/>

  <!-- Subtle constellation points representing precision tracking -->
  <circle cx="210" cy="185" r="2" fill="#F2F0EA" opacity="0.8"/>
  <circle cx="340" cy="275" r="2.5" fill="#B9C0C7" opacity="0.7"/>
  <circle cx="500" cy="240" r="3" fill="#F2F0EA" opacity="0.9"/>
  <circle cx="640" cy="210" r="2" fill="#89958C" opacity="0.7"/>
</svg>
